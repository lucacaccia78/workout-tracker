<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d0f13"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><title>Workout Tracker V2</title><style>
body{margin:0;background:#0d0f13;color:#f7f8fb;font-family:system-ui,-apple-system,sans-serif}.app{max-width:950px;margin:auto;padding:18px 14px 90px}.muted{color:#a9b1bd}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}.card,.session{background:#151922;border:1px solid #303847;border-radius:15px;padding:14px;margin:10px 0}button{background:#151922;color:#fff;border:1px solid #303847;border-radius:11px;padding:11px;font-weight:700}button.active,.primary{background:#fff;color:#111}.danger{color:#ffb2b2}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}input,textarea{background:#10141a;color:#fff;border:1px solid #303847;border-radius:9px;padding:9px;font:inherit}textarea{width:100%;min-height:50px;margin-top:8px;box-sizing:border-box}.sets{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:9px}.set{background:#1d2430;padding:8px;border-radius:10px}.set input{width:100%;box-sizing:border-box;margin-top:5px}.target{font-size:12px;color:#a9b1bd}.status{color:#a7e7b3;min-height:20px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:600px}td,th{padding:7px;border-bottom:1px solid #303847;font-size:12px;text-align:left}th{color:#a9b1bd}.head{display:flex;justify-content:space-between;align-items:center}.footer{position:sticky;bottom:0;padding:18px 0;background:linear-gradient(transparent,#0d0f13 30%)}@media(max-width:700px){.sets{grid-template-columns:1fr 1fr}.tools>*{flex:1}}
</style></head><body><div class="app"><h1>Workout Tracker <small class="muted">V2</small></h1><div class="muted">Programma PT</div><div class="tools"><input id="date" type="date"><button id="load">Carica ultimo</button><button id="backup">Backup</button><button id="clear" class="danger">Azzera dati</button></div><div id="status" class="status"></div><div class="tabs"><button id="d1" class="active">DAY 1 · UPPER</button><button id="d2">DAY 2 · LOWER</button></div><div id="workout"></div><h2>Storico sessioni</h2><div class="muted">I target della scheda non vengono registrati come reps eseguite.</div><div id="history"></div><div class="footer"><button id="save" class="primary" style="width:100%">Salva allenamento</button></div></div><script>
const W={1:[["Riscaldamento","10 kcal vogatore + riscaldamento parte alta",0,[]],["Chest press","3 serie · 8+8+8 · carico a scalare",3,["8+8+8","8+8+8","8+8+8"]],["Lat machine presa stretta","3×12 · recupero 60″",3,["12","12","12"]],["Cardio 1","20 kcal",0,[]],["Bicipiti a martello","3 serie · max reps",3,["max","max","max"]],["Tricipiti cavo alto presa inversa","3×12",3,["12","12","12"]],["Cardio 2","20 kcal",0,[]],["Alzate frontali al cavo basso","3 serie · 8+8+8",3,["8+8+8","8+8+8","8+8+8"]],["Plank commando","4×10",4,["10","10","10","10"]],["Cardio 3","20 kcal",0,[]]],2:[["Riscaldamento","15 kcal bike + riscaldamento parte bassa",0,[]],["Sumo squat macchina verticale","4×10",4,["10","10","10","10"]],["Affondi posteriori","3×20",3,["20","20","20"]],["Leg extension","3 serie · 10 con fermo + 5 normali scalando",3,["10+5","10+5","10+5"]],["Leg curl seduto","4×10",4,["10","10","10","10"]],["Leg press","3 serie · 8+8+8 · carico a scalare",3,["8+8+8","8+8+8","8+8+8"]],["Cardio finale","15–20 min · bassa intensità",0,[]]]};const KEY="luca_workout_v2";let day=1,$=x=>document.getElementById(x);$("date").value=new Date().toISOString().slice(0,10);function get(){try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){return[]}}function put(x){localStorage.setItem(KEY,JSON.stringify(x))}
function render(){$("d1").classList.toggle("active",day===1);$("d2").classList.toggle("active",day===2);$("workout").innerHTML=W[day].map((e,i)=>{let s="";for(let j=0;j<e[2];j++)s+=`<div class=set><div class=target>Serie ${j+1} · target ${e[3][j]}</div><input data-k="kg-${i}-${j}" placeholder="kg / carichi"><input data-k="rp-${i}-${j}" placeholder="reps effettive"></div>`;return `<div class=card><b>${e[0]}</b><div class=muted>${e[1]}</div>${e[2]?`<div class=sets>${s}</div>`:""}<textarea data-k="n-${i}" placeholder="Note / cardio effettivo"></textarea></div>`}).join("")}
function collect(){let v={};document.querySelectorAll("[data-k]").forEach(x=>{if(x.value.trim())v[x.dataset.k]=x.value.trim()});return{id:Date.now(),date:$("date").value,day,vals:v}}
function save(){let x=collect();if(!Object.keys(x.vals).length){$("status").textContent="Inserisci almeno un dato.";return}let a=get(),l=a[a.length-1];if(l&&l.date===x.date&&l.day===x.day&&JSON.stringify(l.vals)===JSON.stringify(x.vals)){$("status").textContent="Duplicato evitato.";return}a.push(x);put(a);$("status").textContent="Allenamento salvato.";hist()}
function load(){let x=get().filter(x=>x.day===day).sort((a,b)=>b.id-a.id)[0];if(!x){$("status").textContent="Nessuna sessione precedente.";return}Object.entries(x.vals).forEach(([k,v])=>{let e=document.querySelector(`[data-k="${k}"]`);if(e)e.value=v});$("status").textContent="Ultimo allenamento caricato."}
function del(id){if(confirm("Eliminare questa sessione?")){put(get().filter(x=>x.id!==id));hist()}}
function hist(){let a=get().slice().sort((a,b)=>b.id-a.id),h=$("history");if(!a.length){h.innerHTML="<div class=card>Nessuna sessione V2 salvata.</div>";return}h.innerHTML=a.map(x=>{let r=W[x.day].map((e,i)=>{let kg=[],rp=[];for(let j=0;j<e[2];j++){if(x.vals[`kg-${i}-${j}`])kg.push(x.vals[`kg-${i}-${j}`]);if(x.vals[`rp-${i}-${j}`])rp.push(x.vals[`rp-${i}-${j}`])}let n=x.vals[`n-${i}`]||"";return kg.length||rp.length||n?`<tr><td>${e[0]}</td><td>${kg.join(" / ")||"—"}</td><td>${rp.join(" / ")||"—"}</td><td>${n||"—"}</td></tr>`:""}).join("");return `<div class=session><div class=head><b>${x.date} · Day ${x.day}</b><button class=danger onclick="del(${x.id})">Elimina</button></div><div class=scroll><table><tr><th>Esercizio</th><th>Carichi</th><th>Reps</th><th>Note</th></tr>${r}</table></div></div>`}).join("")}
$("d1").onclick=()=>{day=1;render()};$("d2").onclick=()=>{day=2;render()};$("save").onclick=save;$("load").onclick=load;$("clear").onclick=()=>{if(confirm("Cancellare tutto lo storico V2?")){localStorage.removeItem(KEY);hist()}};$("backup").onclick=()=>{let b=new Blob([JSON.stringify(get(),null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="workout-backup-v2.json";a.click()};render();hist();if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js");
</script></body></html>
