<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071b2d"><link rel="manifest" href="manifest.webmanifest"><title>Workout V4.0</title><style>
:root{--n:#071b2d;--b:#1687ff;--p:#f2f6fa;--l:#dce5ef;--m:#718297;--g:#168f60}*{box-sizing:border-box}body{margin:0;background:var(--p);font-family:system-ui,-apple-system,sans-serif;color:#102033}.app{max-width:760px;margin:auto;padding-bottom:82px}.top{position:sticky;top:0;z-index:9;background:var(--n);color:#fff;padding:calc(11px + env(safe-area-inset-top)) 13px 11px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.title{font-weight:800;font-size:19px}.small{font-size:12px;color:var(--m)}.top .small{color:#abc0d2}.finish{background:#fff1f1;color:#a92f2f;border:1px solid #efbaba;border-radius:10px;padding:8px 11px;font-weight:800}.page{display:none;padding:11px}.page.on{display:block}.card{background:#fff;border:1px solid var(--l);border-radius:15px;padding:12px;margin:9px 0}.btn{border:1px solid #ccd9e4;border-radius:11px;padding:11px;font-weight:750;background:#fff;color:#17334c}.primary{background:linear-gradient(#49a9ff,#1687ff);color:#fff;border-color:#1687ff}.choice{display:grid;grid-template-columns:1fr 1fr;gap:9px}.choice button{min-height:80px}.banner{background:#eaf7f0;border:1px solid #bce4cf;border-radius:14px;padding:12px}.badge{display:inline-block;font-size:10px;font-weight:850;border-radius:99px;padding:4px 7px;background:#e9f7ef;color:#14724d}.done{background:#eef3f7;color:#617486}.ex{display:flex;gap:10px;align-items:center}.thumb{width:68px;height:52px;object-fit:cover;border-radius:9px;background:#e9f2fa}.ename{font-weight:800}.last{margin-top:7px;background:#eef6ff;padding:7px;border-radius:9px;font-size:12px;color:#315c83}.best{color:#14724d}.set{display:grid;grid-template-columns:42px 1fr 1fr;gap:6px;align-items:center;background:#f6f9fc;padding:7px;border-radius:9px;margin-top:6px}.drop{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}input,textarea{width:100%;min-width:0;border:1px solid #ccd9e4;border-radius:9px;padding:9px;font:inherit}textarea{margin-top:7px}.rest{font-size:12px;margin-top:7px}.rest button{border:0;border-radius:8px;background:var(--b);color:#fff;padding:6px 9px}.sup{border:2px solid #f0cccc}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid #d7e1ea;padding:6px 3px calc(6px + env(safe-area-inset-bottom));z-index:10}.nav button{border:0;background:transparent;min-height:51px;color:#65798d;font-size:11px;border-radius:9px}.nav b{display:block;font-size:18px}.nav .on{color:var(--b);background:#eef6ff}.session{background:#fff;border:1px solid var(--l);border-radius:14px;padding:12px;margin:9px 0}.muscles{display:flex;gap:6px;overflow:auto;padding-bottom:5px}.muscles button{white-space:nowrap;border:1px solid #ccd9e4;background:#fff;border-radius:99px;padding:8px 11px}.muscles .on{background:var(--n);color:#fff}.progress{padding:10px 0;border-bottom:1px solid var(--l)}.modal{display:none;position:fixed;inset:0;background:#0007;z-index:30;align-items:flex-end}.modal.on{display:flex}.sheet{width:min(760px,100%);margin:auto;background:#fff;border-radius:18px 18px 0 0;padding:18px 13px calc(18px + env(safe-area-inset-bottom));max-height:80vh;overflow:auto}.sheet button{padding:12px}.toolbar{display:flex;gap:7px}.toolbar>*{flex:1}.scroll{overflow:auto}table{width:100%;border-collapse:collapse}td,th{font-size:12px;padding:7px;border-bottom:1px solid var(--l);text-align:left}h2{font-size:20px}h3{margin:3px 0}
</style></head><body><div class=app><header class=top><div class=row><div><div class=title id=ttl>Allenamento</div><div class=small>Workout Tracker V4.0 · Classic</div></div><button id=finish class=finish style="display:none">Termina</button></div><div id=saveState class=small></div></header>
<section id=train class="page on"><div id=home></div><div id=editor></div></section><section id=hist class=page><h2>Storico</h2><div id=histList></div></section><section id=stats class=page><h2>Progressi</h2><div class=muscles id=muscles></div><div class=card id=progress></div></section><section id=more class=page><h2>Altro</h2><div class=card><div class=toolbar><button class=btn id=backup>Backup</button><button class=btn id=importB>Importa</button><input id=importF type=file accept=".json" hidden></div></div></section>
<nav class=nav><button class=on data-p=train><b>●</b>Allenamento</button><button data-p=hist><b>▣</b>Storico</button><button data-p=stats><b>▥</b>Progressi</button><button data-p=more><b>•••</b>Altro</button></nav>
<div id=endModal class=modal><div class=sheet><h3>Terminare l'allenamento?</h3><p>I dati sono già salvati. La sessione diventerà COMPLETATA.</p><button class=btn id=cancel>Annulla</button> <button class="btn primary" id=confirm>Termina e salva</button></div></div>
<div id=detail class=modal><div class=sheet><div class=row><h3 id=dtitle>Dettaglio</h3><button class=btn id=close>Chiudi</button></div><div id=dbody></div></div></div>
</div><script>
const OLD="luca_workout_v21",KEY="luca_workout_v40_sessions",$=x=>document.getElementById(x);
const W={1:[["Riscaldamento","Cardio","note","warmup","10 kcal vogatore + parte alta"],["Chest press","Petto","drop","chest","3 serie · 8+8+8",3,60],["Lat machine presa stretta","Dorso","normal","lat","3×12",3,60,12],["Cardio 1","Cardio","note","cardio","20 kcal"],["Bicipiti a martello","Bicipiti","normal","curl","3 serie · max reps",3,0,"max"],["Tricipiti cavo alto presa inversa","Tricipiti","normal","triceps","3 serie",3,60,12],["Cardio 2","Cardio","note","cardio","20 kcal"],["Alzate frontali al cavo basso","Spalle","drop","front","3 serie · 8+8+8",3,60],["Plank commando","Core","reps","plank","4×10",4,45,10],["Cardio 3","Cardio","note","cardio","20 kcal"]],2:[["Riscaldamento","Cardio","note","warmup","15 kcal bike"],["Sumo squat macchina verticale","Gambe","normal","sumo","4×10",4,90,10],["Affondi posteriori","Gambe","normal","lunges","3×20 · kg per mano",3,90,20],["Leg extension","Gambe","legext","legext","10 fermo + 5 normali",3,60],["Leg curl seduto","Gambe","normal","legcurl","4×10",4,60,10],["Leg press","Gambe","drop","legpress","3 serie · 8+8+8",3,90],["Cardio finale","Cardio","note","cardio","15–20 min"]]};
let current=null,timerI=null;
function all(){try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){return[]}}function put(a){localStorage.setItem(KEY,JSON.stringify(a))}
function migrate(){if(localStorage.getItem(KEY)!==null)return;let o=[];try{o=JSON.parse(localStorage.getItem(OLD)||"[]")}catch(e){};put((o||[]).map(x=>({id:x.id||Date.now()+Math.random(),date:x.date,day:x.day,status:"completed",vals:x.vals||{},createdAt:x.id||Date.now()})))}
function active(){return all().find(x=>x.status==="active")}function cur(){return all().find(x=>x.id===current)}
function start(day){if(active()){current=active().id;return renderTrain()}let x={id:Date.now(),date:new Date().toISOString().slice(0,10),day,status:"active",vals:{},createdAt:Date.now()};let a=all();a.push(x);put(a);current=x.id;renderTrain()}
function persist(){let x=cur();if(!x)return;document.querySelectorAll("#editor [data-k]").forEach(e=>{e.value.trim()?x.vals[e.dataset.k]=e.value.trim():delete x.vals[e.dataset.k]});let a=all(),i=a.findIndex(z=>z.id===x.id);a[i]=x;put(a);$("saveState").textContent="Salvato automaticamente ✓"}
function metric(v,i){let a=[];Object.entries(v||{}).forEach(([k,z])=>{if(k.startsWith(`kg-${i}-`)){let n=parseFloat(String(z).replace(",","."));if(!isNaN(n))a.push(n)}});return a.length?Math.max(...a):null}
function lastbest(day,i){let h=all().filter(x=>x.status==="completed"&&x.day===day).sort((a,b)=>b.id-a.id).map(x=>metric(x.vals,i)).filter(x=>x!=null);return [h[0]??null,h.length?Math.max(...h):null]}
function fields(e,i,v){let t=e[2],sets=e[5]||0,rest=e[6]||0,target=e[7]||"";if(t==="note")return `<textarea data-k="n-${i}" placeholder="Note / cardio">${v[`n-${i}`]||""}</textarea>`;let h="";for(let s=0;s<sets;s++){if(t==="drop"){h+=`<div class=drop>`;for(let q=0;q<3;q++)h+=`<input data-k="kg-${i}-${s}-${q}" placeholder="kg ${q+1}" value="${v[`kg-${i}-${s}-${q}`]||""}">`;h+=`</div>`}else if(t==="legext")h+=`<div class=drop style="grid-template-columns:1fr 1fr"><input data-k="kg-${i}-${s}-0" placeholder="10 fermo kg" value="${v[`kg-${i}-${s}-0`]||""}"><input data-k="kg-${i}-${s}-1" placeholder="5 normali kg" value="${v[`kg-${i}-${s}-1`]||""}"></div>`;else if(t==="reps")h+=`<div class=set><span>S${s+1}</span><input data-k="rp-${i}-${s}" placeholder="reps" value="${v[`rp-${i}-${s}`]||""}"><span></span></div>`;else h+=`<div class=set><span>S${s+1}</span><input data-k="kg-${i}-${s}" placeholder="kg" value="${v[`kg-${i}-${s}`]||""}"><input data-k="rp-${i}-${s}" placeholder="reps ${target}" value="${v[`rp-${i}-${s}`]||""}"></div>`}return h+(rest?`<div class=rest>Recupero ${rest}″ <button onclick="timer(${rest},'t${i}')">Timer</button> <span id=t${i}></span></div>`:"")+`<textarea data-k="n-${i}" placeholder="Note">${v[`n-${i}`]||""}</textarea>`}
function card(e,i,v){let p=lastbest(cur().day,i);return `<div class=card><div class=ex><img class=thumb src="exercise-images/${e[3]}.png" onerror="this.style.display='none'"><div><div class=ename>${e[0]}</div><div class=small>${e[4]}</div></div></div><div class=last>Ultima volta: <b>${p[0]??"—"} kg</b> · <span class=best>Migliore: <b>${p[1]??"—"} kg</b></span></div>${fields(e,i,v)}</div>`}
function renderTrain(){let x=current?cur():active();if(x){current=x.id;$("home").innerHTML=`<div class=banner><span class=badge>IN CORSO</span><h3>Day ${x.day} · ${x.date}</h3><div class=small>Puoi navigare nell'app: questa sessione resta salvata.</div></div>`;$("editor").innerHTML=W[x.day].map((e,i)=>card(e,i,x.vals)).join("");$("finish").style.display="block"}else{current=null;$("finish").style.display="none";$("editor").innerHTML="";$("home").innerHTML=`<div class=card><h2>Nuovo allenamento</h2><div class=choice><button class="btn primary" onclick="start(1)">DAY 1<br>Upper Body</button><button class="btn primary" onclick="start(2)">DAY 2<br>Lower Body</button></div></div>`}}
function detail(id){let x=all().find(z=>z.id===id);$("dtitle").textContent=`${x.date} · Day ${x.day}${x.status==="active"?" · IN CORSO":""}`;let r=W[x.day].map((e,i)=>{let z=[];Object.entries(x.vals||{}).forEach(([k,v])=>{if(k.includes(`-${i}-`)||k===`n-${i}`)z.push(v)});return z.length?`<tr><td>${e[0]}</td><td>${z.join(" · ")}</td></tr>`:""}).join("");$("dbody").innerHTML=`<table><tr><th>Esercizio</th><th>Dati</th></tr>${r}</table>`;$("detail").classList.add("on")}
function history(){let a=all().slice().sort((a,b)=>b.id-a.id);$("histList").innerHTML=a.map(x=>`<div class=session><div class=row><div><b>${x.date} · Day ${x.day}</b><br><span class="badge ${x.status==="completed"?"done":""}">${x.status==="active"?"IN CORSO":"COMPLETATO"}</span></div><button class=btn onclick="detail(${x.id})">Apri</button></div>${x.status==="active"?`<button class="btn primary" style="width:100%;margin-top:8px" onclick="current=${x.id};show('train');renderTrain()">Continua allenamento</button>`:""}</div>`).join("")||"<div class=card>Nessuna sessione.</div>"}
const M=["Tutti","Petto","Dorso","Spalle","Bicipiti","Tricipiti","Gambe","Core"];
function stats(m="Tutti"){$("muscles").innerHTML=M.map(x=>`<button class="${x===m?"on":""}" onclick="stats('${x}')">${x}</button>`).join("");let r=[];[1,2].forEach(d=>W[d].forEach((e,i)=>{if(e[1]==="Cardio"||(m!=="Tutti"&&e[1]!==m))return;let v=all().filter(x=>x.status==="completed"&&x.day===d).sort((a,b)=>a.id-b.id).map(x=>[x.date,metric(x.vals,i)]).filter(x=>x[1]!=null);if(!v.length)return;let last=v.at(-1)[1],prev=v.length>1?v.at(-2)[1]:null,best=Math.max(...v.map(x=>x[1]));r.push(`<div class=progress><b>${e[0]}</b> <span class=small>· ${e[1]}</span><div>Ultimo <b>${last} kg</b> · Migliore <b>${best} kg</b>${prev==null?"":` · Δ ${(last-prev)>=0?"+":""}${last-prev} kg`}</div><div class=small>${v.map(x=>`${x[0].slice(5)}: ${x[1]}`).join(" → ")}</div></div>`)}));$("progress").innerHTML=r.join("")||"<span class=small>Nessun dato disponibile.</span>"}
function finish(){persist();let a=all(),i=a.findIndex(x=>x.id===current);if(i>=0)a[i].status="completed";put(a);current=null;$("endModal").classList.remove("on");renderTrain();history();stats()}
function timer(s,id){clearInterval(timerI);let n=s,e=$(id);e.textContent=n+"s";timerI=setInterval(()=>{e.textContent=--n+"s";if(n<=0){clearInterval(timerI);e.textContent="OK"}},1000)}
function show(id){if(current&&id!=="train")persist();document.querySelectorAll(".page").forEach(x=>x.classList.toggle("on",x.id===id));document.querySelectorAll(".nav button").forEach(x=>x.classList.toggle("on",x.dataset.p===id));$("ttl").textContent={train:"Allenamento",hist:"Storico",stats:"Progressi",more:"Altro"}[id];$("finish").style.display=id==="train"&&active()?"block":"none";if(id==="hist")history();if(id==="stats")stats()}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>show(b.dataset.p));document.addEventListener("input",e=>{if(e.target.matches("#editor input,#editor textarea")){clearTimeout(window.a);window.a=setTimeout(persist,150)}});document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"&&current)persist()});window.addEventListener("pagehide",()=>{if(current)persist()});$("finish").onclick=()=>$("endModal").classList.add("on");$("cancel").onclick=()=>$("endModal").classList.remove("on");$("confirm").onclick=finish;$("close").onclick=()=>$("detail").classList.remove("on");$("backup").onclick=()=>{let b=new Blob([JSON.stringify(all(),null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="workout-backup-v40.json";a.click()};$("importB").onclick=()=>$("importF").click();$("importF").onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(!Array.isArray(d))throw 0;if(confirm("Sostituire lo storico con questo backup?")){put(d);current=null;renderTrain();history();stats()}}catch(x){alert("Backup non valido")}e.target.value=""};migrate();renderTrain();history();stats();if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js");
</script></body></html>
