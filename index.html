<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d0f13"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><title>Workout Tracker V2.1</title><style>
*{box-sizing:border-box}body{margin:0;background:#0d0f13;color:#f7f8fb;font-family:system-ui,-apple-system,sans-serif}.app{max-width:760px;margin:auto;padding:16px 12px 88px}.muted,.target{color:#a9b1bd}.target{font-size:12px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.card,.session{background:#151922;border:1px solid #303847;border-radius:14px;padding:12px;margin:9px 0}button{background:#151922;color:#fff;border:1px solid #303847;border-radius:10px;padding:10px;font-weight:700}button.active,.primary{background:#fff;color:#111}.danger{color:#ffb2b2}.tools{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}input,textarea{background:#10141a;color:#fff;border:1px solid #303847;border-radius:9px;padding:9px;font:inherit}textarea{width:100%;min-height:44px;margin-top:8px}.set{background:#1d2430;padding:8px;border-radius:10px;margin-top:7px}.row{display:grid;grid-template-columns:52px 1fr 1fr;gap:6px;align-items:center}.drop{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}.drop input,.row input{width:100%;min-width:0}.status{color:#a7e7b3;min-height:18px;font-size:13px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:560px}td,th{padding:7px;border-bottom:1px solid #303847;font-size:12px;text-align:left}th{color:#a9b1bd}.head{display:flex;justify-content:space-between;align-items:center}.footer{position:sticky;bottom:0;padding:17px 0;background:linear-gradient(transparent,#0d0f13 30%)}h1{font-size:24px;margin:0}h3{margin:0 0 3px;font-size:16px}@media(max-width:520px){.tools>*{flex:1}.row{grid-template-columns:46px 1fr 1fr}}
</style></head><body><div class=app><h1>Workout Tracker <span class=muted style="font-size:13px">V2.1</span></h1><div class=muted>Inserimento rapido palestra</div><div class=tools><input id=date type=date><button id=load>Carica ultimo</button><button id=backup>Backup</button><button id=clear class=danger>Azzera</button></div><div id=status class=status></div><div class=tabs><button id=d1 class=active>DAY 1 · UPPER</button><button id=d2>DAY 2 · LOWER</button></div><div id=workout></div><h2>Storico</h2><div id=history></div><div class=footer><button id=save class=primary style="width:100%">Salva allenamento</button></div></div><script>
const W={1:[
{name:"Riscaldamento",meta:"10 kcal vogatore + parte alta",type:"note"},
{name:"Chest press",meta:"3 serie · 8+8+8",type:"drop",sets:3,target:["8","8","8"]},
{name:"Lat machine presa stretta",meta:"3×12 · recupero 60″",type:"normal",sets:3,target:"12"},
{name:"Cardio 1",meta:"20 kcal",type:"note"},
{name:"Bicipiti a martello",meta:"3 serie · max reps",type:"normal",sets:3,target:"max"},
{name:"Tricipiti cavo alto presa inversa",meta:"3 serie",type:"normal",sets:3,target:"12"},
{name:"Cardio 2",meta:"20 kcal",type:"note"},
{name:"Alzate frontali al cavo basso",meta:"3 serie · 8+8+8",type:"drop",sets:3,target:["8","8","8"]},
{name:"Plank commando",meta:"4×10",type:"reps",sets:4,target:"10"},
{name:"Cardio 3",meta:"20 kcal",type:"note"}],
2:[
{name:"Riscaldamento",meta:"15 kcal bike + parte bassa",type:"note"},
{name:"Sumo squat macchina verticale",meta:"4×10",type:"normal",sets:4,target:"10"},
{name:"Affondi posteriori",meta:"3×20 · kg per mano",type:"normal",sets:3,target:"20"},
{name:"Leg extension",meta:"3 serie · 10 con fermo + 5 normali",type:"legext",sets:3},
{name:"Leg curl seduto",meta:"4×10",type:"normal",sets:4,target:"10"},
{name:"Leg press",meta:"3 serie · 8+8+8",type:"drop",sets:3,target:["8","8","8"]},
{name:"Cardio finale",meta:"15–20 min · bassa intensità",type:"note"}]};
const KEY="luca_workout_v21";let day=1,$=x=>document.getElementById(x);$("date").value=new Date().toISOString().slice(0,10);
function get(){try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){return[]}}function put(x){localStorage.setItem(KEY,JSON.stringify(x))}
function fields(e,i){if(e.type==="note")return `<textarea data-k="n-${i}" placeholder="Note / cardio effettivo"></textarea>`;let out="";
for(let s=0;s<e.sets;s++){if(e.type==="drop"){out+=`<div class=set><div class=target>Serie ${s+1} · 8 + 8 + 8</div><div class=drop><input data-k="kg-${i}-${s}-0" inputmode=decimal placeholder="kg 1"><input data-k="kg-${i}-${s}-1" inputmode=decimal placeholder="kg 2"><input data-k="kg-${i}-${s}-2" inputmode=decimal placeholder="kg 3"></div></div>`}
else if(e.type==="legext"){out+=`<div class=set><div class=target>Serie ${s+1}</div><div class=drop style="grid-template-columns:1fr 1fr"><input data-k="kg-${i}-${s}-0" inputmode=decimal placeholder="10 reps fermo · kg"><input data-k="kg-${i}-${s}-1" inputmode=decimal placeholder="5 reps · kg"></div></div>`}
else if(e.type==="reps"){out+=`<div class=set><div class=row><span class=target>S${s+1}</span><input data-k="rp-${i}-${s}" inputmode=numeric placeholder="reps · target ${e.target}"><span></span></div></div>`}
else{out+=`<div class=set><div class=row><span class=target>S${s+1}</span><input data-k="kg-${i}-${s}" inputmode=decimal placeholder="kg"><input data-k="rp-${i}-${s}" inputmode=numeric placeholder="reps · ${e.target}"></div></div>`}}
return out+`<textarea data-k="n-${i}" placeholder="Note (opzionale)"></textarea>`}
function render(){$("d1").classList.toggle("active",day===1);$("d2").classList.toggle("active",day===2);$("workout").innerHTML=W[day].map((e,i)=>`<div class=card><h3>${e.name}</h3><div class=muted>${e.meta}</div>${fields(e,i)}</div>`).join("")}
function collect(){let v={};document.querySelectorAll("#workout [data-k]").forEach(x=>{if(x.value.trim())v[x.dataset.k]=x.value.trim()});return{id:Date.now(),date:$("date").value,day,vals:v}}
function save(){let x=collect();if(!Object.keys(x.vals).length){$("status").textContent="Inserisci almeno un dato.";return}let a=get(),l=a[a.length-1];if(l&&l.date===x.date&&l.day===x.day&&JSON.stringify(l.vals)===JSON.stringify(x.vals)){$("status").textContent="Duplicato evitato.";return}a.push(x);put(a);$("status").textContent="Allenamento salvato.";hist()}
function load(){let x=get().filter(x=>x.day===day).sort((a,b)=>b.id-a.id)[0];if(!x){$("status").textContent="Nessuna sessione precedente.";return}Object.entries(x.vals).forEach(([k,v])=>{let e=document.querySelector(`[data-k="${k}"]`);if(e)e.value=v});$("status").textContent="Ultimo allenamento caricato."}
function summary(x,e,i){let kg=[],rp=[];Object.entries(x.vals).forEach(([k,v])=>{if(k.startsWith(`kg-${i}-`))kg.push(v);if(k.startsWith(`rp-${i}-`))rp.push(v)});let n=x.vals[`n-${i}`]||"";return kg.length||rp.length||n?`<tr><td>${e.name}</td><td>${kg.join(" / ")||"—"}</td><td>${rp.join(" / ")||"—"}</td><td>${n||"—"}</td></tr>`:""}
function del(id){if(confirm("Eliminare questa sessione?")){put(get().filter(x=>x.id!==id));hist()}}
function hist(){let a=get().slice().sort((a,b)=>b.id-a.id),h=$("history");if(!a.length){h.innerHTML="<div class=card>Nessuna sessione V2.1 salvata.</div>";return}h.innerHTML=a.map(x=>`<div class=session><div class=head><b>${x.date} · Day ${x.day}</b><button class=danger onclick="del(${x.id})">Elimina</button></div><div class=scroll><table><tr><th>Esercizio</th><th>Carichi</th><th>Reps</th><th>Note</th></tr>${W[x.day].map((e,i)=>summary(x,e,i)).join("")}</table></div></div>`).join("")}
$("d1").onclick=()=>{day=1;render()};$("d2").onclick=()=>{day=2;render()};$("save").onclick=save;$("load").onclick=load;$("clear").onclick=()=>{if(confirm("Cancellare tutto lo storico V2.1?")){localStorage.removeItem(KEY);hist()}};$("backup").onclick=()=>{let b=new Blob([JSON.stringify(get(),null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="workout-backup-v21.json";a.click()};render();hist();if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js");
</script></body></html>
