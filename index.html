<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d0f13"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><title>Workout Tracker V2.3</title><style>
*{box-sizing:border-box}body{margin:0;background:#0d0f13;color:#f7f8fb;font-family:system-ui,-apple-system,sans-serif}.app{max-width:760px;margin:auto;padding:16px 12px 90px}.muted,.target,.last{color:#a9b1bd}.target,.last{font-size:12px}.last{margin-top:5px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.card,.session,.superset{background:#151922;border:1px solid #303847;border-radius:14px;padding:12px;margin:9px 0}.superset{border-width:2px}.superset-title{font-size:12px;letter-spacing:.08em;color:#d7dce4;font-weight:800;margin-bottom:8px}.inside{border-top:1px solid #303847;padding-top:10px;margin-top:10px}button{background:#151922;color:#fff;border:1px solid #303847;border-radius:10px;padding:10px;font-weight:700}button.active,.primary{background:#fff;color:#111}.danger{color:#ffb2b2}.tools,.session-actions{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}input,textarea{background:#10141a;color:#fff;border:1px solid #303847;border-radius:9px;padding:9px;font:inherit}textarea{width:100%;min-height:44px;margin-top:8px}.set{background:#1d2430;padding:8px;border-radius:10px;margin-top:7px}.row{display:grid;grid-template-columns:52px 1fr 1fr;gap:6px;align-items:center}.drop{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}.drop input,.row input{width:100%;min-width:0}.rest{font-size:12px;margin-top:7px;color:#d7dce4}.timer{display:inline-flex;gap:6px;align-items:center;margin-top:6px}.timer button{padding:6px 9px;font-size:12px}.status{color:#a7e7b3;min-height:18px;font-size:13px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:560px}td,th{padding:7px;border-bottom:1px solid #303847;font-size:12px;text-align:left}th{color:#a9b1bd}.head{display:flex;justify-content:space-between;align-items:center}.footer{position:sticky;bottom:0;padding:17px 0;background:linear-gradient(transparent,#0d0f13 30%)}h1{font-size:24px;margin:0}h3{margin:0 0 3px;font-size:16px}.editflag{color:#ffd98a;font-size:13px;margin:8px 0}@media(max-width:520px){.tools>*{flex:1}.row{grid-template-columns:46px 1fr 1fr}}
</style></head><body><div class=app><h1>Workout Tracker <span class=muted style="font-size:13px">V2.3</span></h1><div class=muted>Autosave · recuperi · superset</div>
<div class=tools><input id=date type=date><button id=load>Carica ultimo</button><button id=backup>Backup</button><button id=importbtn>Importa backup</button><input id=importfile type=file accept="application/json,.json" hidden></div><div id=editflag class=editflag></div><div id=draftstatus class=status>Bozza pronta</div><div id=status class=status></div>
<div class=tabs><button id=d1 class=active>DAY 1 · UPPER</button><button id=d2>DAY 2 · LOWER</button></div><div id=workout></div>
<h2>Storico</h2><div id=history></div><div class=footer><button id=save class=primary style="width:100%">Termina e salva allenamento</button></div></div><script>
const W={1:[
{name:"Riscaldamento",meta:"10 kcal vogatore + parte alta",type:"note"},
{name:"Chest press",meta:"3 serie · 8+8+8",type:"drop",sets:3,rest:60},
{name:"Lat machine presa stretta",meta:"3×12",type:"normal",sets:3,target:"12",rest:60},
{name:"Cardio 1",meta:"20 kcal",type:"note"},
{name:"Bicipiti a martello",meta:"3 serie · max reps",type:"normal",sets:3,target:"max",rest:0,group:"A"},
{name:"Tricipiti cavo alto presa inversa",meta:"3 serie",type:"normal",sets:3,target:"12",rest:60,group:"A"},
{name:"Cardio 2",meta:"20 kcal",type:"note"},
{name:"Alzate frontali al cavo basso",meta:"3 serie · 8+8+8",type:"drop",sets:3,rest:60},
{name:"Plank commando",meta:"4×10",type:"reps",sets:4,target:"10",rest:45},
{name:"Cardio 3",meta:"20 kcal",type:"note"}],
2:[
{name:"Riscaldamento",meta:"15 kcal bike + parte bassa",type:"note"},
{name:"Sumo squat macchina verticale",meta:"4×10",type:"normal",sets:4,target:"10",rest:90},
{name:"Affondi posteriori",meta:"3×20 · kg per mano",type:"normal",sets:3,target:"20",rest:90},
{name:"Leg extension",meta:"3 serie · 10 con fermo + 5 normali",type:"legext",sets:3,rest:60},
{name:"Leg curl seduto",meta:"4×10",type:"normal",sets:4,target:"10",rest:60},
{name:"Leg press",meta:"3 serie · 8+8+8",type:"drop",sets:3,rest:90},
{name:"Cardio finale",meta:"15–20 min · bassa intensità",type:"note"}]};
const KEY="luca_workout_v21", DRAFT="luca_workout_v23_draft", $=x=>document.getElementById(x);
let day=1,editing=null,timerInt=null,draftTimer=null,audioCtx=null;
$("date").value=new Date().toISOString().slice(0,10);
function get(){try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){return[]}}function put(x){localStorage.setItem(KEY,JSON.stringify(x))}
function previous(exIndex){let a=get().filter(x=>x.day===day).sort((a,b)=>b.id-a.id);for(let x of a){let vals=[];Object.entries(x.vals).forEach(([k,v])=>{if(k.startsWith(`kg-${exIndex}-`)||k.startsWith(`rp-${exIndex}-`))vals.push(v)});if(vals.length)return `${x.date}: ${vals.join(" · ")}`}return "Nessun dato precedente"}
function beep(){
 try{
  audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==="suspended")audioCtx.resume();
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.connect(g);g.connect(audioCtx.destination);o.frequency.value=880;g.gain.value=.18;
  o.start();setTimeout(()=>{o.stop()},450);
 }catch(e){}
 if(navigator.vibrate)navigator.vibrate([180,90,180]);
}
function timer(sec,el){
 clearInterval(timerInt);let left=sec;el.textContent=`${left}s`;
 timerInt=setInterval(()=>{left--;el.textContent=`${left}s`;if(left<=0){clearInterval(timerInt);el.textContent="RECUPERO OK";beep()}},1000)
}
function restUI(sec,i){if(!sec)return "";return `<div class=rest>Recupero: ${sec}″ <span class=timer><button onclick="timer(${sec},document.getElementById('t-${i}'))">Avvia timer</button><span id="t-${i}"></span></span></div>`}
function fields(e,i){if(e.type==="note")return `<textarea data-k="n-${i}" placeholder="Note / cardio effettivo"></textarea>`;let out="";
for(let s=0;s<e.sets;s++){if(e.type==="drop")out+=`<div class=set><div class=target>Serie ${s+1} · 8 + 8 + 8</div><div class=drop><input data-k="kg-${i}-${s}-0" inputmode=decimal placeholder="kg 1"><input data-k="kg-${i}-${s}-1" inputmode=decimal placeholder="kg 2"><input data-k="kg-${i}-${s}-2" inputmode=decimal placeholder="kg 3"></div></div>`;
else if(e.type==="legext")out+=`<div class=set><div class=target>Serie ${s+1}</div><div class=drop style="grid-template-columns:1fr 1fr"><input data-k="kg-${i}-${s}-0" inputmode=decimal placeholder="10 fermo · kg"><input data-k="kg-${i}-${s}-1" inputmode=decimal placeholder="5 normali · kg"></div></div>`;
else if(e.type==="reps")out+=`<div class=set><div class=row><span class=target>S${s+1}</span><input data-k="rp-${i}-${s}" inputmode=numeric placeholder="reps · ${e.target}"><span></span></div></div>`;
else out+=`<div class=set><div class=row><span class=target>S${s+1}</span><input data-k="kg-${i}-${s}" inputmode=decimal placeholder="kg"><input data-k="rp-${i}-${s}" inputmode=numeric placeholder="reps · ${e.target}"></div></div>`}
return out+restUI(e.rest,i)+`<textarea data-k="n-${i}" placeholder="Note (opzionale)"></textarea>`}
function exHTML(e,i,inside=false){return `<div class=${inside?"inside":"card"}><h3>${e.name}</h3><div class=muted>${e.meta}</div><div class=last>Ultima volta: ${previous(i)}</div>${fields(e,i)}</div>`}
function render(){ $("d1").classList.toggle("active",day===1);$("d2").classList.toggle("active",day===2);let out="",used=new Set();W[day].forEach((e,i)=>{if(used.has(i))return;if(e.group){let ids=W[day].map((z,j)=>z.group===e.group?j:-1).filter(j=>j>=0);ids.forEach(j=>used.add(j));out+=`<div class=superset><div class=superset-title>SUPERSET ${e.group} · SENZA PAUSA TRA I DUE ESERCIZI</div>${ids.map(j=>exHTML(W[day][j],j,true)).join("")}<div class=rest>Recupero dopo la coppia: 60″</div></div>`}else{used.add(i);out+=exHTML(e,i)}});$("workout").innerHTML=out}
function currentVals(){let v={};document.querySelectorAll("#workout [data-k]").forEach(x=>{if(x.value.trim())v[x.dataset.k]=x.value.trim()});return v}
function saveDraft(){
 clearTimeout(draftTimer);
 draftTimer=setTimeout(()=>{
   const d={date:$("date").value,day,editing,vals:currentVals(),savedAt:Date.now()};
   localStorage.setItem(DRAFT,JSON.stringify(d));
   $("draftstatus").textContent="Bozza salvata automaticamente ✓";
 },180)
}
function readDraft(){try{return JSON.parse(localStorage.getItem(DRAFT)||"null")}catch(e){return null}}
function clearDraft(){localStorage.removeItem(DRAFT)}
function restoreDraft(){
 const d=readDraft(); if(!d || !d.vals || !Object.keys(d.vals).length)return false;
 day=d.day||1; editing=d.editing||null; $("date").value=d.date||$("date").value;
 render(); fill({vals:d.vals});
 if(editing){$("save").textContent="Aggiorna e termina allenamento";$("editflag").textContent=`MODIFICA SESSIONE ${d.date} · DAY ${day}`}
 $("draftstatus").textContent="Bozza precedente ripristinata ✓";
 return true
}
function collect(){let v={};document.querySelectorAll("#workout [data-k]").forEach(x=>{if(x.value.trim())v[x.dataset.k]=x.value.trim()});return{id:editing||Date.now(),date:$("date").value,day,vals:v}}
function fill(x){Object.entries(x.vals).forEach(([k,v])=>{let e=document.querySelector(`[data-k="${k}"]`);if(e)e.value=v})}
function save(){
 let x=collect();if(!Object.keys(x.vals).length){$("status").textContent="Inserisci almeno un dato.";return}
 let a=get();
 if(editing){
   let p=a.findIndex(z=>z.id===editing);if(p>=0)a[p]=x;
   editing=null;$("save").textContent="Termina e salva allenamento";$("editflag").textContent="";
   $("status").textContent="Allenamento aggiornato e salvato nello storico.";
 }else{
   let l=a[a.length-1];
   if(l&&l.date===x.date&&l.day===x.day&&JSON.stringify(l.vals)===JSON.stringify(x.vals)){$("status").textContent="Duplicato evitato.";return}
   a.push(x);$("status").textContent="Allenamento concluso e salvato nello storico.";
 }
 put(a);clearDraft();$("draftstatus").textContent="Nessuna bozza in corso";hist();render()
}
function edit(id){let x=get().find(z=>z.id===id);if(!x)return;day=x.day;editing=id;$("date").value=x.date;$("save").textContent="Aggiorna e termina allenamento";$("editflag").textContent=`MODIFICA SESSIONE ${x.date} · DAY ${x.day}`;render();fill(x);localStorage.setItem(DRAFT,JSON.stringify({date:x.date,day:x.day,editing:id,vals:x.vals,savedAt:Date.now()}));$("draftstatus").textContent="Modifica salvata come bozza ✓";window.scrollTo({top:0,behavior:"smooth"})}
function load(){let x=get().filter(x=>x.day===day).sort((a,b)=>b.id-a.id)[0];if(!x){$("status").textContent="Nessuna sessione precedente.";return}fill(x);$("status").textContent="Ultimo allenamento caricato."}
function del(id){if(confirm("Eliminare questa sessione?")){put(get().filter(x=>x.id!==id));hist();render()}}
function summary(x,e,i){let kg=[],rp=[];Object.entries(x.vals).forEach(([k,v])=>{if(k.startsWith(`kg-${i}-`))kg.push(v);if(k.startsWith(`rp-${i}-`))rp.push(v)});let n=x.vals[`n-${i}`]||"";return kg.length||rp.length||n?`<tr><td>${e.name}</td><td>${kg.join(" / ")||"—"}</td><td>${rp.join(" / ")||"—"}</td><td>${n||"—"}</td></tr>`:""}
function hist(){let a=get().slice().sort((a,b)=>b.id-a.id),h=$("history");if(!a.length){h.innerHTML="<div class=card>Nessuna sessione salvata.</div>";return}h.innerHTML=a.map(x=>`<div class=session><div class=head><b>${x.date} · Day ${x.day}</b></div><div class=session-actions><button onclick="edit(${x.id})">Modifica</button><button class=danger onclick="del(${x.id})">Elimina</button></div><div class=scroll><table><tr><th>Esercizio</th><th>Carichi</th><th>Reps</th><th>Note</th></tr>${W[x.day].map((e,i)=>summary(x,e,i)).join("")}</table></div></div>`).join("")}
function switchDay(n){saveDraft();setTimeout(()=>{day=n;editing=null;render();$("draftstatus").textContent="Nuova bozza Day "+n},220)}
$("d1").onclick=()=>switchDay(1);$("d2").onclick=()=>switchDay(2);
$("save").onclick=save;$("load").onclick=()=>{load();saveDraft()};
$("backup").onclick=()=>{let b=new Blob([JSON.stringify(get(),null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="workout-backup-v23.json";a.click()};
$("importbtn").onclick=()=>$("importfile").click();
$("importfile").onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text());if(!Array.isArray(data))throw 0;if(confirm(`Importare ${data.length} sessioni? Lo storico attuale verrà sostituito dal backup.`)){put(data);hist();render();$("status").textContent="Backup importato correttamente."}}catch(err){$("status").textContent="File di backup non valido."}e.target.value=""};
document.addEventListener("input",e=>{if(e.target.matches("#workout input,#workout textarea"))saveDraft()});
$("date").addEventListener("change",saveDraft);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"){const d={date:$("date").value,day,editing,vals:currentVals(),savedAt:Date.now()};localStorage.setItem(DRAFT,JSON.stringify(d))}});
window.addEventListener("pagehide",()=>{const d={date:$("date").value,day,editing,vals:currentVals(),savedAt:Date.now()};localStorage.setItem(DRAFT,JSON.stringify(d))});
render();hist();restoreDraft();if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js");
</script></body></html>
